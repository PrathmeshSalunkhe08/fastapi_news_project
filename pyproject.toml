[project]
name = "concurrent-news-scraper"
version = "0.1.0"
description = "Concurrent Multi-Source News Scraper & LLM Summarizer with LangChain and Pydantic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
]
